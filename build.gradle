plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	runs {
		client {
			programArg "--username"
			programArg "Zcylas"
		}
		// Live-world verification suites (fake players, entity spawns, block/saved-data edits) run ONLY here:
		// a separate, disposable run directory whose world is wiped before every launch. Never run/.
		verificationServer {
			server()
			name "Minecraft Server (disposable verification world)"
			runDir "build/verification-run"
			vmArg "-Dtotality.liveWorldVerification=true"
		}
	}
}

tasks.named("runVerificationServer") {
	doFirst {
		def dir = file("build/verification-run")
		delete(new File(dir, "world"))
		dir.mkdirs()
		// Reuse the EULA acceptance already given for the normal dev run directory; never accept it on its own.
		def devEula = file("run/eula.txt")
		if (devEula.exists() && devEula.text.contains("eula=true")) {
			new File(dir, "eula.txt").text = devEula.text
		}
	}
}

loom.log4jConfigs.from "log4j-dev.xml"

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// ── Voice Input API: bundled offline speech recognition ─────────────────────────────────────────
// Vosk (Apache-2.0) is nested into the Totality jar as its official published artifact: five Java
// classes plus natives for Linux x86-64, Windows x86-64 (with its MinGW runtime DLLs) and Intel macOS.
def voskVersion = "0.3.45"
// The English model is bundled as the official, unmodified archive. Alpha Cephei publishes no
// checksum, so the SHA-256 below is Totality's own pin, taken from the official download on
// 2026-09-25; the build refuses any other bytes. See THIRD_PARTY_NOTICES.md.
def voiceModel = [
	id      : "vosk-model-small-en-us-0.15",
	url     : "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip",
	sha256  : "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498",
	size    : 41205931L,
	license : "Apache-2.0",
	required: "am/final.mdl,conf/mfcc.conf,conf/model.conf,graph/Gr.fst,graph/HCLr.fst,graph/disambig_tid.int,"
			+ "graph/phones/word_boundary.int,ivector/final.dubm,ivector/final.ie,ivector/final.mat,"
			+ "ivector/global_cmvn.stats,ivector/online_cmvn.conf,ivector/splice.conf",
]
// Cached outside build/ so `clean` does not force a re-download; the pin is re-checked every time.
def voiceModelArchive = file("${gradle.gradleUserHomeDir}/caches/totality/voice-models/${voiceModel.id}.zip")

def sha256Hex = { File f ->
	def digest = java.security.MessageDigest.getInstance("SHA-256")
	f.withInputStream { i ->
		byte[] buffer = new byte[65536]
		int n
		while ((n = i.read(buffer)) > 0) digest.update(buffer, 0, n)
	}
	digest.digest().encodeHex().toString()
}

def fetchVoiceModel = tasks.register("fetchVoiceModel") {
	group = "totality"
	description = "Downloads the pinned Vosk English model once into the Gradle cache and verifies its SHA-256."
	inputs.property("url", voiceModel.url)
	inputs.property("sha256", voiceModel.sha256)
	outputs.file(voiceModelArchive)
	doLast {
		if (voiceModelArchive.isFile() && voiceModelArchive.length() == voiceModel.size
				&& sha256Hex(voiceModelArchive) == voiceModel.sha256) {
			return
		}
		voiceModelArchive.parentFile.mkdirs()
		def part = new File(voiceModelArchive.path + ".part")
		logger.lifecycle("Downloading ${voiceModel.url}")
		URI.create(voiceModel.url).toURL().withInputStream { i -> part.withOutputStream { o -> o << i } }
		def actual = sha256Hex(part)
		if (part.length() != voiceModel.size || actual != voiceModel.sha256) {
			part.delete()
			throw new GradleException("Voice model download failed verification: expected ${voiceModel.size} bytes / "
					+ "sha256 ${voiceModel.sha256}, got ${part.length()} bytes / sha256 ${actual}")
		}
		java.nio.file.Files.move(part.toPath(), voiceModelArchive.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
	}
}

// The manifest the runtime reads (VoiceModelDescriptor): one source of truth for the pin.
def generateVoiceModelManifest = tasks.register("generateVoiceModelManifest") {
	def outDir = layout.buildDirectory.dir("generated/voiceModelManifest")
	inputs.property("model", voiceModel.toString())
	outputs.dir(outDir)
	doLast {
		def f = outDir.get().file("totality/voice/models/${voiceModel.id}.properties").asFile
		f.parentFile.mkdirs()
		f.text = """# Generated by build.gradle (generateVoiceModelManifest). Do not edit.
id=${voiceModel.id}
archive=totality/voice/models/${voiceModel.id}.zip
archive.sha256=${voiceModel.sha256}
archive.size=${voiceModel.size}
source.url=${voiceModel.url}
license=${voiceModel.license}
required=${voiceModel.required}
"""
	}
}

processResources {
	from(fetchVoiceModel) { into "totality/voice/models" }
	from(generateVoiceModelManifest)
}

jar {
	from("THIRD_PARTY_NOTICES.md")
	from("licenses/third-party") { into "META-INF/licenses/third-party" }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Real registered-item tests (Tooltip V2 Pass 1): client game tests in src/gametest, run by runClientGameTest in
	// the disposable build/run/clientGameTest directory with a fresh test world. Never touches run/.
	configureTests {
		createSourceSet = true
		modId = "totality-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
		clearRunDirectory = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5, for pure-logic unit tests (e.g. api/rpg/resources) that don't need a running game.
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Voice Input API (see the "Voice Input API" section below). Non-transitive: Vosk's POM asks for
	// JNA 5.7.0, but Minecraft 26.2 already ships JNA 5.17.0, which Vosk 0.3.45 runs against.
	implementation("com.alphacephei:vosk:${voskVersion}") { transitive = false }
	include("com.alphacephei:vosk:${voskVersion}")
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}