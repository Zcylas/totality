plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	runs {
		client {
			programArg "--username"
			programArg "Zcylas"
		}
		// Live-world verification suites (fake players, entity spawns, block/saved-data edits) run ONLY here:
		// a separate, disposable run directory whose world is wiped before every launch. Never run/.
		verificationServer {
			server()
			name "Minecraft Server (disposable verification world)"
			runDir "build/verification-run"
			vmArg "-Dtotality.liveWorldVerification=true"
		}
	}
}

tasks.named("runVerificationServer") {
	doFirst {
		def dir = file("build/verification-run")
		delete(new File(dir, "world"))
		dir.mkdirs()
		// Reuse the EULA acceptance already given for the normal dev run directory; never accept it on its own.
		def devEula = file("run/eula.txt")
		if (devEula.exists() && devEula.text.contains("eula=true")) {
			new File(dir, "eula.txt").text = devEula.text
		}
	}
}

loom.log4jConfigs.from "log4j-dev.xml"

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Real registered-item tests (Tooltip V2 Pass 1): client game tests in src/gametest, run by runClientGameTest in
	// the disposable build/run/clientGameTest directory with a fresh test world. Never touches run/.
	configureTests {
		createSourceSet = true
		modId = "totality-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
		clearRunDirectory = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JUnit 5, for pure-logic unit tests (e.g. api/rpg/resources) that don't need a running game.
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}